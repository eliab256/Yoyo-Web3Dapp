name: yoyoIndexer
project_type: no-code
config:
  buffer: 4
timestamps: null
networks:
  - name: sepolia
    chain_id: 11155111
    rpc: https://sepolia.gateway.tenderly.co/public/sepolia
    block_poll_frequency: optimized
    compute_units_per_second: 300
storage:
  postgres:
    enabled: true
    drop_each_run: false
native_transfers:
  enabled: false
contracts:
  - name: YoyoAuction
    details:
      - network: sepolia
        address: 0xFC188F25EE67D68BC61C74714DAA431d0719D1fe
        start_block: '10079173'
    abi: ./YoyoAuction.abi.json
    include_events:
      - YoyoAuction__BidPlaced
      - YoyoAuction__BidderRefunded
      - YoyoAuction__BidderRefundFailed
      - YoyoAuction__AuctionOpened
      - YoyoAuction__AuctionRestarted
      - YoyoAuction__AuctionClosed
      - YoyoAuction__AuctionFinalized
      - YoyoAuction__MintFailed
      - YoyoAuction__ManualUpkeepExecuted
  - name: YoyoNft
    details:
      - network: sepolia
        address: 0xbf993f5eE3b657Ce8Def22D14fE2733C9e37Bbd5
        start_block: '10079173'
    abi: ./YoyoNft.abi.json
    include_events:
      - YoyoNft__WithdrawCompleted
      - YoyoNft__DepositCompleted
      - YoyoNft__MintPriceUpdated
      - YoyoNft__NftMinted
      - Transfer
global:
  health_port: 8081